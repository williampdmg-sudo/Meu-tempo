<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7fa">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meu Tempo"><title>Meu Tempo — Organizador pessoal</title>
<style>
:root{--bg:#f7f7fa;--paper:#fff;--ink:#242431;--muted:#858594;--line:#e9e9ef;--purple:#6b5bd2;--pale:#f0edff;--green:#398b70;--orange:#c98539;--red:#c75c67;--shadow:0 8px 28px #25233b0c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1000px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(94px + env(safe-area-inset-bottom))}
header{height:68px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:850;font-size:21px;letter-spacing:-.8px}.logo span{color:var(--purple)}.subdate{font-size:11px;color:var(--muted);margin-top:2px}.headright{display:flex;gap:8px}.ib{height:40px;width:40px;border:1px solid var(--line);background:white;border-radius:13px;color:var(--ink);font-size:17px}
.hero{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:19px 20px;box-shadow:var(--shadow)}.eyebrow{font-size:10px;color:var(--purple);font-weight:800;text-transform:uppercase;letter-spacing:1.2px}.hero h1{font-size:25px;letter-spacing:-.8px;margin:6px 0}.hero p{font-size:12px;color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:17px}.stat{background:#f8f8fb;border-radius:13px;padding:10px}.stat b{font-size:20px;display:block}.stat small{font-size:10px;color:var(--muted)}
.nav{display:flex;gap:5px;overflow:auto;margin:16px 0 18px;padding:4px;background:#ededf2;border-radius:15px;scrollbar-width:none}.nav button{border:0;background:none;color:#777786;padding:10px 12px;border-radius:11px;white-space:nowrap;font-size:12px;font-weight:750}.nav button.active{background:#fff;color:var(--purple);box-shadow:0 2px 8px #17172910}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 1px 13px}.pagehead h2{font-size:19px;margin:0;letter-spacing:-.4px}.muted{color:var(--muted);font-size:12px}.primary,.secondary,.ghost,.danger{border:0;border-radius:12px;padding:11px 14px;font-size:12px;font-weight:800}.primary{background:var(--purple);color:white}.secondary{background:var(--pale);color:var(--purple)}.ghost{background:#f0f0f4;color:#5e5e6e}.danger{background:#fff0f0;color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow);min-width:0}.card h3{font-size:13px;margin:0 0 12px}.big{font-size:25px;font-weight:850;letter-spacing:-1px}.tiny{font-size:10px;color:var(--muted)}.progress{height:7px;background:#eeeef3;border-radius:20px;overflow:hidden;margin:9px 0}.progress i{height:100%;display:block;background:var(--purple);border-radius:20px}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;display:flex;align-items:flex-start;gap:10px}.itembody{flex:1;min-width:0}.itemtitle{font-size:13px;font-weight:750;overflow-wrap:anywhere}.meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:10px;margin-top:6px}.tag{display:inline-flex;background:#f2f1f7;color:#68627f;border-radius:20px;padding:4px 8px;font-size:10px}.itemactions{display:flex;gap:5px}.mini{border:0;background:#f3f2f7;color:#68627f;border-radius:9px;padding:6px 8px;font-size:11px}.check{accent-color:var(--purple);width:18px;height:18px;margin-top:1px}.done .itemtitle{text-decoration:line-through;color:#9b9ba7}.empty{border:1px dashed #d8d7e2;background:#fff;border-radius:16px;text-align:center;padding:28px 15px;color:var(--muted);font-size:12px}.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.toolbar strong{font-size:15px}.monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.weekday{text-align:center;color:var(--muted);font-size:10px;padding:7px 0}.date{min-height:48px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:center;padding:7px 1px;font-size:12px}.date.dim{opacity:.35}.date.sel{background:var(--pale);border-color:var(--purple);color:var(--purple);font-weight:800}.date.today{outline:1px solid var(--purple)}.dots{display:flex;justify-content:center;gap:2px;margin-top:4px}.dots i{height:4px;width:4px;border-radius:50%;background:var(--purple)}
.weekrow{display:grid;grid-template-columns:38px 1fr;gap:8px;margin:8px 0}.weekdaybox{font-size:10px;color:var(--muted);padding-top:9px}.weekevents{min-height:48px;border-left:2px solid #e5e2f4;padding-left:9px}.yeargrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.yearmonth{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.yearmonth b{font-size:12px}.yearmonth button{border:0;background:none;padding:2px;color:var(--muted);font-size:9px}
.fab{position:fixed;right:max(18px,calc((100vw - 1000px)/2 + 20px));bottom:calc(20px + env(safe-area-inset-bottom));z-index:5;border:0;border-radius:16px;background:var(--purple);color:#fff;padding:14px 18px;font-weight:800;box-shadow:0 7px 20px #6b5bd244}
.modalback{display:none;position:fixed;inset:0;background:#17172570;z-index:10;align-items:flex-end;justify-content:center}.modalback.show{display:flex}.modal{width:100%;max-width:620px;max-height:94dvh;overflow:auto;background:#fff;border-radius:23px 23px 0 0;padding:19px 17px calc(22px + env(safe-area-inset-bottom))}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modalhead h2{font-size:18px;margin:0}.close{border:0;background:#f0f0f4;border-radius:10px;width:34px;height:34px}
.field{margin:11px 0}.field label{display:block;font-size:11px;font-weight:750;color:#656575;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:white;outline-color:var(--purple);font-size:13px}.field textarea{min-height:65px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formfoot{display:flex;gap:8px;margin-top:17px}.formfoot .primary{flex:1}.filepick{display:block;padding:12px;text-align:center;border:1px dashed #c9c4e5;border-radius:12px;color:var(--purple);font-size:12px;font-weight:750}.files{font-size:11px;color:var(--muted);margin-top:5px}.fileline{display:flex;justify-content:space-between;padding:5px 0;gap:6px}.fileline button{border:0;background:none;color:var(--purple)}
.notice{padding:12px 13px;background:#f1efff;border-radius:13px;color:#5d548f;font-size:11px;line-height:1.5;margin-bottom:12px}.notice.warn{background:#fff5e9;color:#8a622b}.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
@media(min-width:680px){.app{padding-left:24px;padding-right:24px}.modalback{align-items:center}.modal{border-radius:22px;padding:23px}.grid{grid-template-columns:repeat(3,1fr)}.yeargrid{grid-template-columns:repeat(3,1fr)}.date{min-height:65px}}
</style></head>
<body><div class="app">
<header><div><div class="logo">meu<span>tempo.</span></div><div class="subdate" id="todayline"></div></div><div class="headright"><button class="ib" id="notifyBtn" title="Ativar notificações">♧</button><button class="ib" id="backupBtn" title="Backup">↥</button></div></header>
<section class="hero"><div class="eyebrow">Seu espaço, seu ritmo</div><h1 id="hello">Organize seu tempo.</h1><p>Compromissos, tarefas, hábitos e objetivos em um só lugar.</p><div class="stats"><div class="stat"><b id="sEvents">0</b><small>compromissos hoje</small></div><div class="stat"><b id="sTasks">0</b><small>tarefas pendentes</small></div><div class="stat"><b id="sHabits">0%</b><small>hábitos de hoje</small></div></div></section>
<nav class="nav" id="nav"><button class="active" data-page="dashboard">Visão geral</button><button data-page="calendar">Agenda</button><button data-page="tasks">Tarefas</button><button data-page="habits">Hábitos</button><button data-page="goals">Metas</button><button data-page="docs">Documentos</button><button data-page="settings">Ajustes</button></nav>
<main id="main"></main>
</div><button class="fab" id="fab">＋ Adicionar</button>
<div class="modalback" id="back"><section class="modal"><div class="modalhead"><h2 id="modalTitle">Adicionar</h2><button class="close" id="close">✕</button></div><form id="form"></form></section></div>
<script>
const $=s=>document.querySelector(s), today=new Date(), dayKey=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}, pad=n=>String(n).padStart(2,'0'), localVal=d=>`${dayKey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`, fmt=d=>new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}), time=d=>new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db, data={events:[],tasks:[],habits:[],goals:[],docs:[]}, page='dashboard', calView='month', focus=new Date(today.getFullYear(),today.getMonth(),today.getDate()), search='';
const openReq=indexedDB.open('meuTempoV2',1);
openReq.onupgradeneeded=()=>{db=openReq.result;['events','tasks','habits','goals','docs'].forEach(n=>{if(!db.objectStoreNames.contains(n))db.createObjectStore(n,{keyPath:'id'})})};
openReq.onsuccess=()=>{db=openReq.result;loadAll()};openReq.onerror=()=>{$('#main').innerHTML='<div class="notice warn">Não foi possível abrir o armazenamento do navegador.</div>';};
function all(store){return new Promise(resolve=>{let r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>resolve([])})}
async function loadAll(){for(let k of Object.keys(data))data[k]=await all(k);render()}
function save(k,obj){return new Promise(resolve=>{let tx=db.transaction(k,'readwrite');tx.objectStore(k).put(obj);tx.oncomplete=()=>{loadAll();resolve()};tx.onerror=()=>alert('Não foi possível salvar este item.')})}
function del(k,id){let tx=db.transaction(k,'readwrite');tx.objectStore(k).delete(id);tx.oncomplete=loadAll}
const uid=()=>crypto.randomUUID();
function setPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();$('#fab').style.display=p==='settings'?'none':'block'}
function render(){let dayEvents=data.events.filter(e=>dayKey(e.start)===dayKey(today));let pending=data.tasks.filter(t=>!t.done);let todaysHabits=data.habits;let doneHabits=todaysHabits.filter(h=>(h.logs||[]).includes(dayKey(today))).length;$('#todayline').textContent=today.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('#hello').textContent=(today.getHours()<12?'Bom dia!':today.getHours()<18?'Boa tarde!':'Boa noite!')+' Vamos organizar seu tempo.';$('#sEvents').textContent=dayEvents.length;$('#sTasks').textContent=pending.length;$('#sHabits').textContent=todaysHabits.length?Math.round(doneHabits/todaysHabits.length*100)+'%':'—';let html='';if(page==='dashboard')html=dashboard();if(page==='calendar')html=calendar();if(page==='tasks')html=tasksPage();if(page==='habits')html=habitsPage();if(page==='goals')html=goalsPage();if(page==='docs')html=docsPage();if(page==='settings')html=settingsPage();$('#main').innerHTML=html}
function eventsList(list){if(!list.length)return '<div class="empty"><b>Agenda livre</b>Nenhum compromisso encontrado neste período.</div>';return '<div class="list">'+list.sort((a,b)=>new Date(a.start)-new Date(b.start)).map(e=>`<div class="item"><div class="itembody"><div class="itemtitle">${esc(e.title)}</div><div class="meta"><span>${fmt(e.start)} · ${time(e.start)}</span><span class="tag">${esc(e.category||'Outro')}</span>${e.location?'<span>'+esc(e.location)+'</span>':''}${e.files?.length?'<span>📎 '+e.files.length+' anexo(s)</span>':''}</div>${e.notes?'<div class="meta">'+esc(e.notes)+'</div>':''}</div><button class="mini" data-edit="events" data-id="${e.id}">Editar</button></div>`).join('')+'</div>'}
function dashboard(){let ev=data.events.filter(e=>dayKey(e.start)===dayKey(today));let tasks=data.tasks.filter(t=>!t.done).slice(0,4);let goals=data.goals;let habits=data.habits;return `<div class="pagehead"><h2>Visão geral</h2><span class="muted">${fmt(today)}</span></div><div class="grid"><div class="card"><h3>Compromissos de hoje</h3><div class="big">${ev.length}</div><div class="tiny">na sua agenda</div></div><div class="card"><h3>Tarefas em aberto</h3><div class="big">${data.tasks.filter(t=>!t.done).length}</div><div class="tiny">para concluir</div></div><div class="card"><h3>Documentos guardados</h3><div class="big">${data.docs.length}</div><div class="tiny">na sua central</div></div></div><div class="pagehead" style="margin-top:22px"><h2>Próximos compromissos</h2><button class="secondary" data-goto="calendar">Ver agenda</button></div>${eventsList(data.events.filter(e=>new Date(e.start)>=new Date(new Date().setHours(0,0,0,0))).slice(0,5))}<div class="pagehead" style="margin-top:22px"><h2>Minhas tarefas</h2><button class="secondary" data-goto="tasks">Ver todas</button></div>${tasks.length?'<div class="list">'+tasks.map(t=>taskItem(t)).join('')+'</div>':'<div class="empty">Tudo em dia por aqui.</div>'}<div class="pagehead" style="margin-top:22px"><h2>Hábitos de hoje</h2><button class="secondary" data-goto="habits">Acompanhar</button></div>${habits.length?'<div class="list">'+habits.map(h=>habitItem(h)).join('')+'</div>':'<div class="empty">Adicione hábitos para acompanhar sua rotina.</div>'}<div class="pagehead" style="margin-top:22px"><h2>Metas em andamento</h2><button class="secondary" data-goto="goals">Ver metas</button></div>${goals.length?'<div class="list">'+goals.slice(0,3).map(goalItem).join('')+'</div>':'<div class="empty">Defina objetivos que deseja alcançar.</div>'}`}
function taskItem(t){return `<div class="item ${t.done?'done':''}"><input class="check" type="checkbox" data-taskcheck="${t.id}" ${t.done?'checked':''}><div class="itembody"><div class="itemtitle">${esc(t.title)}</div><div class="meta"><span>${t.due?'Prazo: '+fmt(t.due):'Sem prazo'}</span><span class="tag">${esc(t.priority||'Normal')}</span></div></div><button class="mini" data-edit="tasks" data-id="${t.id}">•••</button></div>`}
function tasksPage(){let list=data.tasks.filter(t=>!search||t.title.toLowerCase().includes(search.toLowerCase()));return `<div class="pagehead"><h2>Tarefas e checklist</h2><span class="muted">${data.tasks.filter(t=>t.done).length}/${data.tasks.length} concluídas</span></div><input class="search" id="filterSearch" placeholder="Buscar tarefas…" value="${esc(search)}"><div class="list">${list.length?list.map(taskItem).join(''):'<div class="empty">Nenhuma tarefa encontrada.</div>'}</div>`}
function habitItem(h){let done=(h.logs||[]).includes(dayKey(today));return `<div class="item"><input class="check" type="checkbox" data-habitcheck="${h.id}" ${done?'checked':''}><div class="itembody"><div class="itemtitle">${esc(h.title)}</div><div class="meta"><span>${esc(h.frequency||'Diário')}</span><span>${(h.logs||[]).length} registros</span></div></div><button class="mini" data-edit="habits" data-id="${h.id}">•••</button></div>`}
function habitsPage(){return `<div class="pagehead"><h2>Hábitos e rotina</h2><span class="muted">${data.habits.length} hábito(s)</span></div><div class="notice">Marque cada hábito quando concluir. O histórico fica registrado por dia neste dispositivo.</div><div class="list">${data.habits.length?data.habits.map(habitItem).join(''):'<div class="empty"><b>Comece com um hábito pequeno</b>Ex.: beber água, ler 10 páginas ou caminhar.</div>'}</div>`}
function goalItem(g){let p=Math.min(100,Math.round((Number(g.current)||0)/(Number(g.target)||1)*100));return `<div class="item"><div class="itembody"><div class="itemtitle">${esc(g.title)}</div><div class="meta"><span>${g.current||0} / ${g.target||1} ${esc(g.unit||'etapas')}</span><span>${g.due?'Até '+fmt(g.due):''}</span></div><div class="progress"><i style="width:${p}%"></i></div></div><button class="mini" data-edit="goals" data-id="${g.id}">Editar</button></div>`}
function goalsPage(){return `<div class="pagehead"><h2>Metas e objetivos</h2><span class="muted">${data.goals.length} meta(s)</span></div><div class="list">${data.goals.length?data.goals.map(goalItem).join(''):'<div class="empty"><b>O que você quer conquistar?</b>Crie metas com prazo e acompanhe seu progresso.</div>'}</div>`}
function docsPage(){return `<div class="pagehead"><h2>Central de documentos</h2><span class="muted">${data.docs.length} arquivo(s)</span></div><div class="notice">Arquivos anexados ficam armazenados no navegador deste dispositivo. Faça backups frequentes para não perder documentos.</div><div class="list">${data.docs.length?data.docs.map(d=>`<div class="item"><div class="itembody"><div class="itemtitle">▤ ${esc(d.name)}</div><div class="meta"><span>${esc(d.category||'Geral')}</span><span>${d.blob?.size?Math.round(d.blob.size/1024)+' KB':''}</span></div></div><button class="mini" data-download="${d.id}">Baixar</button><button class="mini" data-edit="docs" data-id="${d.id}">•••</button></div>`).join(''):'<div class="empty"><b>Sua biblioteca pessoal</b>Guarde documentos importantes, comprovantes e referências.</div>'}</div>`}
function calendar(){let y=focus.getFullYear(),m=focus.getMonth(),label=calView==='year'?y:calView==='week'?'Semana de '+fmt(focus):calView==='day'?focus.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}):focus.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});let top=`<div class="pagehead"><h2>Agenda</h2><button class="secondary" data-caladd>＋ Compromisso</button></div><div class="toolbar"><strong>${label}</strong><div><button class="mini" data-calnav="-1">‹</button> <button class="mini" data-calnow>Hoje</button> <button class="mini" data-calnav="1">›</button></div></div><div class="nav" style="margin:0 0 14px"><button data-calview="day" class="${calView==='day'?'active':''}">Dia</button><button data-calview="week" class="${calView==='week'?'active':''}">Semana</button><button data-calview="month" class="${calView==='month'?'active':''}">Mês</button><button data-calview="year" class="${calView==='year'?'active':''}">Ano</button></div>`;if(calView==='day')return top+eventsList(data.events.filter(e=>dayKey(e.start)===dayKey(focus)));if(calView==='week'){let monday=new Date(focus);monday.setDate(monday.getDate()-(monday.getDay()+6)%7);return top+Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(monday.getDate()+i);return `<div class="weekrow"><div class="weekdaybox">${d.toLocaleDateString('pt-BR',{weekday:'short'})}<br>${d.getDate()}</div><div class="weekevents">${eventsList(data.events.filter(e=>dayKey(e.start)===dayKey(d)))}</div></div>`}).join('')}if(calView==='year')return top+'<div class="yeargrid">'+Array.from({length:12},(_,i)=>`<div class="yearmonth"><b>${new Date(y,i,1).toLocaleDateString('pt-BR',{month:'long'})}</b><div>${data.events.filter(e=>new Date(e.start).getMonth()===i&&new Date(e.start).getFullYear()===y).length} compromisso(s)</div><button data-month="${i}">Abrir mês →</button></div>`).join('')+'</div>';let first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),cells='';for(let i=0;i<42;i++){let n=i-offset+1,d=n<1?new Date(y,m-1,new Date(y,m,0).getDate()+n):n>days?new Date(y,m+1,n-days):new Date(y,m,n),list=data.events.filter(e=>dayKey(e.start)===dayKey(d));cells+=`<button class="date ${d.getMonth()!==m?'dim':''} ${dayKey(d)===dayKey(focus)?'sel':''} ${dayKey(d)===dayKey(today)?'today':''}" data-date="${dayKey(d)}">${d.getDate()}${list.length?'<div class="dots"><i></i></div>':''}</button>`}return top+'<div class="monthgrid">'+['seg','ter','qua','qui','sex','sáb','dom'].map(x=>`<div class="weekday">${x}</div>`).join('')+cells+'</div><div class="pagehead" style="margin-top:18px"><h2>'+focus.toLocaleDateString('pt-BR',{day:'numeric',month:'long'})+'</h2></div>'+eventsList(data.events.filter(e=>dayKey(e.start)===dayKey(focus)))}
function settingsPage(){return `<div class="pagehead"><h2>Ajustes e sincronização</h2></div><div class="notice warn"><b>Sobre o uso em vários dispositivos</b><br>Esta versão salva os dados localmente no navegador. Para sincronização automática real entre celular e computador, será necessário conectar um serviço de nuvem e configurar uma conta. Até lá, use o backup para transferir seus dados manualmente.</div><div class="card"><h3>Notificações</h3><p class="muted">Permita notificações do navegador para receber lembretes. O navegador precisa continuar aberto para verificar os horários programados nesta versão.</p><button class="secondary" id="askNotify">Ativar notificações</button><p class="tiny" id="notifyStatus">${'Permissão: '+(Notification?.permission||'indisponível')}</p></div><div class="card" style="margin-top:10px"><h3>Backup e restauração</h3><p class="muted">Exporte seus dados para um arquivo JSON. Guarde esse arquivo em local seguro e importe-o em outro dispositivo.</p><button class="primary" id="exportData">Exportar backup</button> <label class="secondary" style="display:inline-block;cursor:pointer">Importar backup <input type="file" id="importData" accept=".json,application/json" hidden></label></div><div class="card" style="margin-top:10px"><h3>Privacidade</h3><p class="muted">Os dados permanecem neste navegador, salvo quando você exporta um backup. Limpar os dados do navegador pode apagar sua agenda e os anexos.</p></div>`}
function openForm(kind,obj=null){let title={events:'Compromisso',tasks:'Tarefa',habits:'Hábito',goals:'Meta',docs:'Documento'}[kind];$('#modalTitle').textContent=(obj?'Editar ':'Novo ')+title.toLowerCase();let f='';if(kind==='events')f=`<div class="field"><label>Título</label><input name="title" required value="${esc(obj?.title)}" placeholder="Ex.: Reunião com cliente"></div><div class="two"><div class="field"><label>Início</label><input name="start" type="datetime-local" required value="${obj?.start?localVal(new Date(obj.start)):localVal(new Date(focus.getFullYear(),focus.getMonth(),focus.getDate(),9))}"></div><div class="field"><label>Término</label><input name="end" type="datetime-local" value="${obj?.end?localVal(new Date(obj.end)):''}"></div></div><div class="two"><div class="field"><label>Categoria</label><select name="category">${['Trabalho','Pessoal','Saúde','Estudos','Família','Lazer','Outro'].map(x=>`<option ${obj?.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Repetição</label><select name="repeat"><option value="none">Não repetir</option><option value="daily" ${obj?.repeat==='daily'?'selected':''}>Diariamente</option><option value="weekly" ${obj?.repeat==='weekly'?'selected':''}>Semanalmente</option><option value="monthly" ${obj?.repeat==='monthly'?'selected':''}>Mensalmente</option><option value="yearly" ${obj?.repeat==='yearly'?'selected':''}>Anualmente</option></select></div></div><div class="field"><label>Local ou link</label><input name="location" value="${esc(obj?.location)}" placeholder="Endereço ou link da reunião"></div><div class="field"><label>Notas</label><textarea name="notes">${esc(obj?.notes)}</textarea></div><div class="field"><label>Lembrete</label><select name="remind"><option value="0">Sem lembrete</option><option value="5">5 minutos antes</option><option value="15">15 minutos antes</option><option value="30">30 minutos antes</option><option value="60">1 hora antes</option><option value="1440">1 dia antes</option></select></div><div class="field"><label>Anexar arquivos</label><label class="filepick">＋ Selecionar arquivos<input name="files" type="file" multiple hidden></label><div class="files">${(obj?.files||[]).map(x=>esc(x.name)).join(' · ')}</div></div>`;
if(kind==='tasks')f=`<div class="field"><label>Tarefa</label><input name="title" required value="${esc(obj?.title)}" placeholder="O que precisa ser feito?"></div><div class="two"><div class="field"><label>Prazo</label><input name="due" type="date" value="${obj?.due||''}"></div><div class="field"><label>Prioridade</label><select name="priority">${['Baixa','Normal','Alta','Urgente'].map(x=>`<option ${obj?.priority===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Checklist (um item por linha)</label><textarea name="checklist" placeholder="Separar materiais&#10;Enviar documento">${(obj?.checklist||[]).map(x=>x.text).join('\n')}</textarea></div>`;
if(kind==='habits')f=`<div class="field"><label>Nome do hábito</label><input name="title" required value="${esc(obj?.title)}" placeholder="Ex.: Ler 15 minutos"></div><div class="field"><label>Frequência</label><select name="frequency"><option>Diário</option><option>Segunda a sexta</option><option>Semanal</option></select></div>`;
if(kind==='goals')f=`<div class="field"><label>Objetivo</label><input name="title" required value="${esc(obj?.title)}" placeholder="Ex.: Concluir curso"></div><div class="two"><div class="field"><label>Progresso atual</label><input name="current" type="number" min="0" value="${obj?.current||0}"></div><div class="field"><label>Alvo</label><input name="target" type="number" min="1" value="${obj?.target||10}"></div></div><div class="two"><div class="field"><label>Unidade</label><input name="unit" value="${esc(obj?.unit||'etapas')}" placeholder="ex.: livros"></div><div class="field"><label>Prazo</label><input name="due" type="date" value="${obj?.due||''}"></div></div>`;
if(kind==='docs')f=`<div class="field"><label>Nome / descrição</label><input name="name" required value="${esc(obj?.name)}" placeholder="Ex.: Contrato de aluguel"></div><div class="field"><label>Categoria</label><select name="category"><option>Trabalho</option><option>Pessoal</option><option>Financeiro</option><option>Estudos</option><option>Saúde</option><option>Geral</option></select></div><div class="field"><label>Arquivo</label><label class="filepick">＋ Selecionar arquivo<input name="file" type="file"></label><div class="files">${obj?.name?esc(obj.name):''}</div></div>`;
$('#form').innerHTML=f+`<div class="formfoot">${obj?'<button type="button" class="danger" id="deleteItem">Excluir</button>':''}<button class="primary" type="submit">Salvar</button></div>`;$('#back').classList.add('show');$('#form').onsubmit=async ev=>{ev.preventDefault();let fd=new FormData(ev.target),id=obj?.id||uid(),record={...(obj||{}),id};if(kind==='events'){Object.assign(record,{title:fd.get('title'),start:new Date(fd.get('start')).toISOString(),end:fd.get('end')?new Date(fd.get('end')).toISOString():'',category:fd.get('category'),repeat:fd.get('repeat'),location:fd.get('location'),notes:fd.get('notes'),remind:Number(fd.get('remind')),files:[...(obj?.files||[]),...Array.from(fd.getAll('files')).filter(x=>x.size).map(x=>({name:x.name,type:x.type,blob:x}))]});}
if(kind==='tasks')Object.assign(record,{title:fd.get('title'),due:fd.get('due'),priority:fd.get('priority'),checklist:fd.get('checklist').split('\n').filter(Boolean).map(text=>({text,done:false})),done:obj?.done||false});
if(kind==='habits')Object.assign(record,{title:fd.get('title'),frequency:fd.get('frequency'),logs:obj?.logs||[]});
if(kind==='goals')Object.assign(record,{title:fd.get('title'),current:Number(fd.get('current')),target:Number(fd.get('target')),unit:fd.get('unit'),due:fd.get('due')});
if(kind==='docs'){let file=fd.get('file');Object.assign(record,{name:fd.get('name'),category:fd.get('category'),blob:file?.size?file:obj?.blob,type:file?.type||obj?.type||''})}
await save(kind,record);$('#back').classList.remove('show')};
if(obj)$('#deleteItem').onclick=()=>{if(confirm('Excluir este item?')){del(kind,obj.id);$('#back').classList.remove('show')}};
}
$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)};
$('#fab').onclick=()=>openForm(({dashboard:'events',calendar:'events',tasks:'tasks',habits:'habits',goals:'goals',docs:'docs'})[page]||'events');
$('#main').onclick=e=>{let g=e.target.closest('[data-goto]');if(g){setPage(g.dataset.goto);return}let edit=e.target.closest('[data-edit]');if(edit){let k=edit.dataset.edit;openForm(k,data[k].find(x=>x.id===edit.dataset.id));return}let tc=e.target.closest('[data-taskcheck]');if(tc){let t=data.tasks.find(x=>x.id===tc.dataset.taskcheck);t.done=tc.checked;save('tasks',t);return}let hc=e.target.closest('[data-habitcheck]');if(hc){let h=data.habits.find(x=>x.id===hc.dataset.habitcheck);h.logs=h.logs||[];h.logs=hc.checked?[...new Set([...h.logs,dayKey(today)])]:h.logs.filter(x=>x!==dayKey(today));save('habits',h);return}let date=e.target.closest('[data-date]');if(date){focus=new Date(date.dataset.date+'T12:00:00');render();return}let mv=e.target.closest('[data-month]');if(mv){focus=new Date(focus.getFullYear(),Number(mv.dataset.month),1);calView='month';render();return}let cv=e.target.closest('[data-calview]');if(cv){calView=cv.dataset.calview;render();return}let cn=e.target.closest('[data-calnav]');if(cn){let n=Number(cn.dataset.calnav);if(calView==='day')focus.setDate(focus.getDate()+n);if(calView==='week')focus.setDate(focus.getDate()+7*n);if(calView==='month')focus.setMonth(focus.getMonth()+n);if(calView==='year')focus.setFullYear(focus.getFullYear()+n);render();return}if(e.target.closest('[data-calnow]')){focus=new Date(today.getFullYear(),today.getMonth(),today.getDate());render();return}if(e.target.closest('[data-caladd]'))openForm('events');let dl=e.target.closest('[data-download]');if(dl){let d=data.docs.find(x=>x.id===dl.dataset.download);downloadBlob(d.blob,d.name)}};
$('#main').addEventListener('input',e=>{if(e.target.id==='filterSearch'){search=e.target.value;let pos=e.target.selectionStart;render();let x=$('#filterSearch');x.focus();x.setSelectionRange(pos,pos)}});
$('#close').onclick=()=>$('#back').classList.remove('show');$('#back').onclick=e=>{if(e.target.id==='back')$('#back').classList.remove('show')};
function downloadBlob(blob,name){if(!blob){alert('Arquivo não encontrado no armazenamento.');return}let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportBackup(){let req=indexedDB.open('meuTempoV2');req.onsuccess=async()=>{let allData={version:2,exportedAt:new Date().toISOString(),data:{}};for(let k of Object.keys(data)){allData.data[k]=await all(k);allData.data[k]=await Promise.all(allData.data[k].map(async o=>{let x={...o};for(let field of ['blob'])if(x[field])x[field]=await blobToData(x[field]);if(x.files)x.files=await Promise.all(x.files.map(async f=>({...f,blob:f.blob?await blobToData(f.blob):null})));return x}))}let b=new Blob([JSON.stringify(allData)],{type:'application/json'});downloadBlob(b,'meu-tempo-backup.json')}}
function blobToData(blob){return new Promise(res=>{let r=new FileReader();r.onload=()=>res({data:r.result,type:blob.type});r.readAsDataURL(blob)})}
async function dataToBlob(x){if(x&&x.data){let r=await fetch(x.data);return await r.blob()}return x}
$('#backupBtn').onclick=exportBackup;
document.addEventListener('click',e=>{if(e.target.id==='exportData')exportBackup();if(e.target.id==='askNotify'||e.target.id==='notifyBtn')requestNotify();});
async function requestNotify(){if(!('Notification'in window)){alert('Este navegador não oferece notificações.');return}let p=await Notification.requestPermission();let el=$('#notifyStatus');if(el)el.textContent='Permissão: '+p;alert(p==='granted'?'Notificações ativadas.':'Permissão de notificação: '+p)}
document.addEventListener('change',async e=>{if(e.target.id==='importData'){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj.data)throw 0;for(let k of Object.keys(data)){for(let rec of (obj.data[k]||[])){if(rec.blob)rec.blob=await dataToBlob(rec.blob);if(rec.files)for(let f of rec.files)if(f.blob)f.blob=await dataToBlob(f.blob);await save(k,rec)}}alert('Backup importado.');}catch(err){alert('Não foi possível importar este arquivo.')}e.target.value=''}});
function checkReminders(){if(!('Notification'in window)||Notification.permission!=='granted')return;let now=Date.now();for(let e of data.events){if(!e.remind||e.notified)continue;let target=new Date(e.start).getTime()-e.remind*60000;if(target<=now&&target>now-60000){new Notification('Lembrete: '+e.title,{body:'Começa às '+time(e.start)});e.notified=true;save('events',e)}}}
setInterval(checkReminders,30000);
render();
</script><script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {})); }</script>
